<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Family Tree</title>

  <!-- D3 -->
  <script src="d3v7js.js"></script>
  <script src="d3-flextree.js"></script>
  <script src="d3-org-chart@3"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1 class="title">🌳 Payasi Pariwar Vansawali</h1>

<!-- ADD MEMBER FORM -->
<div class="form-container">
  <h3>Add Family Member</h3>

  <input id="name" placeholder="Name" />
  <input id="role" placeholder="Role / Branch" />
  <!-- PARENT DROPDOWN -->
  <select id="parentId">
    <option value="">-- Select Parent (Root if empty) --</option>
  </select>
  <input id="color" placeholder="Color (eg #22c55e)" />

  <button id="addBtn" onclick="addMember()">
    <span id="btnText">Add Member</span>
    <span id="loader" class="loader" style="display:none;"></span>
  </button>
</div>

<div id="message" class="message success" style="display:none;">
  ✅ Member added successfully
</div>

<div id="chart-container"></div>

<script src="script.js"></script>
</body>
</html>
